# compose.yaml
name: quickstart

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: quickstart
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d quickstart"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
